name: Deploy to production (VPS)

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deployments at the same time; a newer push waits for the running one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://laser-cleaning-ffm.de

    steps:
      - name: Checkout (website files only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*.html
            /robots.txt
            /sitemap.xml
            /resources/img/
          sparse-checkout-cone-mode: false

      - name: Assemble site bundle
        run: |
          set -euo pipefail
          mkdir -p _site/resources
          cp ./*.html robots.txt sitemap.xml _site/
          cp -r resources/img _site/resources/
          echo "Files to deploy:"
          find _site -type f | sort | sed 's#^_site/#  #'

      - name: Check internal links resolve
        run: |
          set -euo pipefail
          missing=0
          for f in _site/*.html; do
            while IFS= read -r ref; do
              # skip external URLs (https:, mailto:, data: ...), protocol-relative and empty/anchor refs
              case "$ref" in ''|//*|*:*) continue ;; esac
              if [ ! -e "_site/$ref" ]; then
                echo "::error file=${f#_site/}::Missing file: $ref"
                missing=1
              fi
            done < <(grep -ohE '(src|href)="[^"]*"' "$f" | sed -E 's/^(src|href)="//; s/"$//; s/[?#].*$//')
          done
          exit $missing

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload with rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          rsync -rlvz --delete --checksum \
            --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes" \
            _site/ "$VPS_USER@$VPS_HOST:${VPS_PATH%/}/"

      - name: Smoke test
        run: |
          set -euo pipefail
          for page in "" impressum.html datenschutz.html; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "https://laser-cleaning-ffm.de/$page")
            echo "/$page -> $code"
            [ "$code" = "200" ] || { echo "::error::/$page returned $code"; exit 1; }
          done

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
